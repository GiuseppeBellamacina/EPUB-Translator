services:
  backend:
    build:
      context: ./backend
      target: prod
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./config.yaml:/config/config.yaml:ro
      # Mounted as a file (not env_file) because keys like OPENAI-API-KEY are not valid env names
      - ./.env:/run/secrets/app.env:ro
    environment:
      - EPUB_ENV_FILE=/run/secrets/app.env
      - EPUB_ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-this-secret}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
