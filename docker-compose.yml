name: translatio  # fixed project name: containers, network and volumes are translatio-*

services:
  backend:
    build:
      context: ./backend
      target: prod
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./config.yaml:/config/config.yaml  # writable: runtime settings from the UI are saved here
      # Mounted as a file (not env_file) because keys like OPENAI-API-KEY are not valid env names
      - ./.env:/run/secrets/app.env:ro
    environment:
      - TRANSLATIO_ENV_FILE=/run/secrets/app.env
      - TRANSLATIO_ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-this-secret}
    extra_hosts:
      # Ollama (or other local servers) on the host; built in on Docker Desktop, needed on Linux
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
