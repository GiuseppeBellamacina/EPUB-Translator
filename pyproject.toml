[project]
name = "epub-translator"
version = "0.1.0"
description = "Tools for translating EPUB files using language models"
readme = "README.MD"
requires-python = ">=3.9"
dependencies = [
    "jupyter>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "ebooklib>=0.18",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-ollama>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
