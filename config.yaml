# Development config, mounted read-only at /config/config.yaml.
# Providers are upserted by name on backend startup. API keys are read from the
# mounted .env (names like OPENAI-API-KEY or OPENAI_API_KEY both work); a provider
# whose api_key_env is missing is skipped. Remove the `providers:` key entirely to
# auto-create providers from whatever known keys are present.

providers:
  # Free, rate-limited (few requests/minute, small daily quota): use for dev runs.
  - name: openrouter-free
    type: custom
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    default_model: nvidia/nemotron-3.5-super-vl:free
    params:
      requests_per_second: 0.25 # free tier allows ~20 requests/minute

  # Paid but cheap: use sparingly.
  - name: openai-cheap
    type: openai
    api_key_env: OPENAI_API_KEY
    default_model: gpt-4.1-nano

  # Deterministic offline provider ("BAU ... MIAO"), no key needed.
  - name: fake
    type: fake
    default_model: fake-meow

# Defaults for every job; a provider's `params` can override requests_per_second,
# max_retries and structured_output_method (function_calling | json_mode | json_schema).
translation:
  max_concurrency: 2 # chapters translated in parallel
  requests_per_second: 0.5 # client-side throttle per job (0 = unlimited)
  llm_max_retries: 5 # SDK retries with exponential backoff on 429/5xx
  chain_retries: 3 # whole-call retries (invalid structured output, residual errors)
  enable_review: true # reviewer pass per chunk (doubles the calls)
