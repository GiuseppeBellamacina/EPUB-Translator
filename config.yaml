providers:
  - name: OpenRouter
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    params:
      requests_per_second: 0.25

  - name: OpenAI
    type: openai
    api_key_env: OPENAI_API_KEY

  - name: fake
    type: fake

translation:
  max_concurrency: 2
  requests_per_second: 0.5
  llm_max_retries: 5
  chain_retries: 3
  enable_review: true
  max_parallel_books: 1
  max_glossary_terms: 150
  max_compendium_entries: 60

pricing:
  models:
    openai:
      - gpt-4.1-nano
      - gpt-4o-mini
      - gpt-4.1-mini
      - gpt-4.1
      - gpt-4o
      - gpt-5.4-nano
      - gpt-6-luna
      - gpt-5.6-luna
      - gpt-5.4-mini
      - gpt-6-sol
      - gpt-6.1-sol
      - gpt-5.6-terra
      - gpt-5.6-sol
      - gpt-6-astra
